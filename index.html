<script>
(function () {
  var d = window.MACRO_DATA;
  var app = document.getElementById('app');
  if (!d) {
    app.innerHTML = '<div class="err">Không tải được dữ liệu. Vui lòng tải lại trang sau ít phút.</div>';
    return;
  }
  function esc(s){return String(s==null?'':s)}
  function cell(v, cls){
    if (v === '—' || v == null || v === '') return '<span class="dash">—</span>';
    if (cls === 'val') return '<span class="val">'+esc(v)+'</span>';
    var c = cls ? ('change '+cls) : 'change';
    if (cls === 'up' || cls === 'down' || cls === 'flat') return '<span class="'+c+'">'+esc(v)+'</span>';
    return '<span class="'+c+'">'+esc(v)+'</span>';
  }
  var m = d.meta;
  var html = '';
  html += '<header class="header"><div class="brand"><div class="logo">ME</div><div><h1>'+esc(m.title)+'</h1><p>'+esc(m.subtitle)+'</p></div></div><div class="meta"><div class="pill"><i class="dot"></i>'+esc(m.status)+'</div><div class="pill">'+esc(m.dateLabel)+'</div><div class="pill">'+esc(m.asOf)+'</div></div></header>';
  html += '<section class="carousel-wrap" id="share-carousel"><div class="carousel-head"><h2>Tổng quan thị trường · vuốt ngang</h2><div class="carousel-hint" id="carousel-asof">Đang cập nhật…</div></div><div class="carousel" id="carousel">'
    + '<article class="c-card" data-c="dxy"><div class="c-lab">DXY</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-sub">Chỉ số đô la Mỹ</div></article>'
    + '<article class="c-card" data-c="ust10y"><div class="c-lab">UST 10Y</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-sub">Lợi suất · thay đổi ngày (bp)</div></article>'
    + '<article class="c-card" data-c="vnindex"><div class="c-lab">VN-Index</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-sub">So với phiên trước</div></article>'
    + '<article class="c-card" data-c="wti"><div class="c-lab">WTI</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-sub">Dầu thô WTI</div></article>'
    + '<article class="c-card" data-c="usdvnd"><div class="c-lab">USD/VND · VCB</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-sbv" id="c-usdvnd-sbv">Tỷ giá trung tâm —</div><div class="c-sub">Giá niêm yết Vietcombank</div></article>'
    + '<article class="c-card" data-c="goldsjc"><div class="c-lab">Vàng SJC · lượng</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-world" id="c-gold-world">Thế giới $—/oz</div><div class="c-sub">Giá SJC / lượng</div></article>'
    + '<article class="c-card geo" data-c="geo"><div class="c-lab">Địa chính trị 24h</div><div class="c-val" id="c-geo-hd">—</div><div class="c-sub" id="c-geo-tag">Tin nổi bật</div></article>'
    + '</div><div class="c-dots" id="c-dots"></div></section>';

  html += '<section class="panel bottom-line" id="bottom-line"><h2>Điểm chính hôm nay</h2><ul>'+(d.bottomLine||[]).map(function(x){var o=(x&&typeof x==='object')?x:{text:x,tone:'neu'};var t=(o.tone==='pos'||o.tone==='neg')?o.tone:'neu';return '<li class="tone-'+t+'">'+esc(o.text)+'</li>';}).join('')+'</ul></section>';

  html += '<section class="live-board" id="live-board"><div class="live-head"><h2>Giá thị trường · Investing.com (có độ trễ)</h2><div class="live-status" id="live-status">Đang tải dữ liệu…</div></div><div class="live-grid">'
    +'<div class="live-item" id="live-dji"><div class="k">Dow Jones</div><div class="live-value">—</div><div class="live-chg"></div></div>'
    +'<div class="live-item" id="live-vn"><div class="k">VN-Index</div><div class="live-value">—</div><div class="live-chg"></div></div>'
    +'<div class="live-item" id="live-brent"><div class="k">Dầu Brent</div><div class="live-value">—</div><div class="live-chg"></div></div>'
    +'<div class="live-item" id="live-dxy"><div class="k">DXY</div><div class="live-value">—</div><div class="live-chg"></div></div>'
    +'<div class="live-item" id="live-ust10y"><div class="k">UST 10Y</div><div class="live-value">—</div><div class="live-chg"></div></div>'
    +'<div class="live-item" id="live-gold"><div class="k">Vàng thế giới</div><div class="live-value">—</div><div class="live-chg"></div></div>'
    +'<div class="live-item" id="live-usdvnd"><div class="k">USD/VND · VCB</div><div class="live-value">—</div><div class="live-chg">Tỷ giá trung tâm —</div></div>'
    +'<div class="live-item" id="live-btc"><div class="k">Bitcoin</div><div class="live-value">—</div><div class="live-chg"></div></div>'
    +'</div></section>';
  html += '<div class="section-label">Bảng chỉ số chi tiết</div>';
  html += '<section class="grid">'+(d.cards||[]).map(function(c){
    var tag = '<span class="tag'+(c.tagClass?(' '+c.tagClass):'')+'">'+esc(c.tag)+'</span>';
    var cols = c.cols||['Chỉ số','% ngày','% tuần'];
    var wide = cols.length > 3;
    var thead = '<div class="thead">'+cols.map(function(h){return '<span>'+esc(h)+'</span>';}).join('')+'</div>';
    var rows = (c.rows||[]).map(function(r){
      var liveAttr='';
      var nk = r.live || '';
      if (!nk) {
        if (/^DXY\b/i.test(r.name)) nk='dxy';
        else if (/^2Y\s*UST|^UST\s*2Y/i.test(r.name)) nk='ust2y';
        else if (/^10Y\s*UST|^UST\s*10Y/i.test(r.name)) nk='ust10y';
        else if (/^2s10s/i.test(r.name)) nk='ust2s10s';
        else if (/^VN-Index/i.test(r.name)) nk='vnindex';
        else if (/EUR\/USD/i.test(r.name)) nk='eurusd';
        else if (/GBP\/USD/i.test(r.name)) nk='gbpusd';
        else if (/USD\/JPY/i.test(r.name)) nk='usdjpy';
        else if (/AUD\/USD/i.test(r.name)) nk='audusd';
        else if (/SBV\s*USD\/VND|USD\/VND/i.test(r.name)) nk='usdvnd';
        else if (/^WTI\b/i.test(r.name)) nk='wti';
        else if (/^Brent\b/i.test(r.name)) nk='brent';
        else if (/^Gold\b/i.test(r.name)) nk='gold';
        else if (/^S&P\s*500/i.test(r.name)) nk='spx';
        else if (/^Nasdaq/i.test(r.name)) nk='ndx';
        else if (/^Dow\b/i.test(r.name)) nk='dji';
        else if (/^Russell/i.test(r.name)) nk='rut';
      }
      if (nk) liveAttr=' data-live-row="'+nk+'"';
      var consCell = wide ? cell(r.cons, r.consClass||'') : ''; /* 4-col card: day=Actual, week=Cons, cons=Prev */
      return '<div class="tr"'+liveAttr+'><span class="name">'+esc(r.name)+'</span>'+cell(r.day,r.dayClass||'')+cell(r.week,r.weekClass||'')+consCell+'</div>';
    }).join('');
    var liveLevel='';
    if (/^DXY$/i.test(c.title)) liveLevel=' data-live-level="dxy"';
    else if (/Oil|Commodities/i.test(c.title)) liveLevel=' data-live-level="brent"';
    else if (/Việt Nam/i.test(c.title)) liveLevel=' data-live-level="vnindex"';
    else if (/US Bond Yields/i.test(c.title)) liveLevel=' data-live-level="ust10y"';
    else if (/Equities/i.test(c.title)) liveLevel=' data-live-level="dji"';
    else if (/FX/i.test(c.title)) liveLevel=' data-live-level="eurusd"';
    return '<article class="card"><div class="card-top"><div class="cat"><div class="icon">'+esc(c.icon)+'</div><div><h3>'+esc(c.title)+'</h3><span>'+esc(c.subtitle)+'</span></div></div>'+tag+'</div><div class="level"'+liveLevel+'>'+esc(c.level)+(c.levelSmall?'<small>'+esc(c.levelSmall)+'</small>':'')+'</div><div class="table'+(wide?' cols-4':'')+'">'+thead+rows+'</div><div class="news"><div class="news-label">Điểm nhấn</div><p>'+esc(c.news)+'</p></div></article>';
  }).join('')+'</section>';
  html += '<div class="section-label">Tin địa chính trị · 24h</div>';
  var geo = d.geoNews || {};
  html += '<section class="geo-feed"><div class="geo-feed-head"><h2>'+esc(geo.title||'Địa chính trị · Tin quan trọng')+'</h2><div class="sub">'+esc(geo.window||'24h gần nhất')+'</div></div>';
  (geo.items||[]).forEach(function(it){
    var tagCls = it.tagClass ? (' '+it.tagClass) : '';
    html += '<article class="geo-item"><div class="meta-row">';
    if (it.tag) html += '<span class="geo-tag'+tagCls+'">'+esc(it.tag)+'</span>';
    if (it.when) html += '<span class="when">'+esc(it.when)+'</span>';
    html += '</div><h3>'+esc(it.headline)+'</h3><p>'+esc(it.summary)+'</p>';
    if (it.url) html += '<a class="more" href="'+esc(it.url)+'" target="_blank" rel="noopener">Đọc nguồn</a>';
    html += '</article>';
  });
  if (!(geo.items||[]).length) html += '<article class="geo-item"><p>Chưa có tin địa chính trị mới trong 24 giờ qua.</p></article>';
  html += '</section>';

  html += '<div class="section-label">Tin AI · 24h</div>';
  var ai = d.aiNews || {};
  html += '<section class="geo-feed"><div class="geo-feed-head"><h2>'+esc(ai.title||'Tin AI · 24h')+'</h2><div class="sub">'+esc(ai.window||'24h gần nhất')+'</div></div>';
  (ai.items||[]).forEach(function(it){
    var tagCls = it.tagClass ? (' '+it.tagClass) : '';
    html += '<article class="geo-item"><div class="meta-row">';
    if (it.tag) html += '<span class="geo-tag'+tagCls+'">'+esc(it.tag)+'</span>';
    if (it.when) html += '<span class="when">'+esc(it.when)+'</span>';
    html += '</div><h3>'+esc(it.headline)+'</h3><p>'+esc(it.summary)+'</p>';
    if (it.url) html += '<a class="more" href="'+esc(it.url)+'" target="_blank" rel="noopener">Đọc nguồn</a>';
    html += '</article>';
  });
  if (!(ai.items||[]).length) html += '<article class="geo-item"><p>Chưa có tin AI mới trong 24 giờ qua.</p></article>';
  html += '</section>';

  var cm = d.comment||{};
  html += '<div class="section-label">Nhận định · đánh giá · dự đoán</div>';
  html += '<section class="analysis"><div class="badge">'+esc(cm.badge||'Macro Eco · Bình luận')+'</div><h2>'+esc(cm.title||'Nhận định chung tình hình')+'</h2>'+(cm.paragraphs||[]).map(function(p){return '<p>'+p+'</p>';}).join('')+'</section>';

  var tr = d.trading||{};
  if (tr.title || tr.body) {
    html += '<section class="trading"><div class="badge">'+esc(tr.badge||'Macro Eco · Chiến lược')+'</div><h2>'+esc(tr.title||'Chiến lược giao dịch')+'</h2><p>'+(tr.body||'')+'</p></section>';
  }
  if (d.sources) {
    html += '<section class="sources"><p><strong>Nguồn tham khảo:</strong> '+esc(d.sources)+'</p></section>';
  }

  html += '<section class="spotlight"><div class="side"><h2>Lịch sự kiện quan trọng</h2><div class="cal">'+(d.catalysts||[]).map(function(x){return '<div class="cal-item"><span class="when">'+esc(x.when)+'</span><span class="what">'+esc(x.what)+'</span></div>';}).join('')+'</div></div></section>';
  html += '<div class="legend"><b>Quy ước:</b><span><i style="background:#087443"></i> tăng</span><span><i style="background:#c73545"></i> giảm</span><span><i style="background:#a7b0bd"></i> chưa có dữ liệu = —</span><span>Fed: so với kỳ họp gần nhất · Lạm phát: Actual dưới Cons xanh, bằng vàng, trên đỏ · Còn lại: % ngày/% tuần</span></div>';
  var f = d.footer||{};
  html += '<footer class="footer"><span>'+esc(f.left||'')+'</span><span class="source">'+esc(f.source||'')+'</span></footer>';
  app.innerHTML = html;
  (function initCarousel(){
    var track = document.getElementById('carousel');
    var dots = document.getElementById('c-dots');
    if (track && dots) {
      var cards = track.querySelectorAll('.c-card');
      dots.innerHTML = Array.prototype.map.call(cards, function(_,i){ return '<i'+(i===0?' class="on"':'')+'></i>'; }).join('');
      track.addEventListener('scroll', function(){
        var i = Math.round(track.scrollLeft / Math.max(track.firstElementChild.offsetWidth,1));
        Array.prototype.forEach.call(dots.children, function(el,j){ el.classList.toggle('on', j===i); });
      }, {passive:true});
    }
    var geo = (d.geoNews && d.geoNews.items && d.geoNews.items[0]) || null;
    if (geo) {
      var hd = document.getElementById('c-geo-hd');
      var tg = document.getElementById('c-geo-tag');
      if (hd) hd.textContent = geo.headline || '—';
      if (tg) tg.textContent = (geo.tag || 'Geo') + (geo.when ? (' · ' + geo.when) : '');
    }
  })();
  document.title = (m.title||'Macro Markets') + ' · ' + (m.dateLabel||'');
})();
</script>
<script>document.write('<script src="./live.js?v='+Date.now()+'"><\/script>');</script>
<audio id="bgm" src="./bgm.mp3" loop preload="none"></audio>
<button type="button" id="bgmToggle" class="bgm-btn" aria-pressed="false" aria-label="Bật nhạc nền" title="Bật nhạc nền"><span class="bgm-ic" aria-hidden="true">♪</span><span>Nhạc nền</span></button>
<script>
(function(){
  var a=document.getElementById('bgm'),b=document.getElementById('bgmToggle');
  if(!a||!b)return;
  var KEY='macroeco_bgm',ic=b.querySelector('.bgm-ic');
  a.volume=0.25;
  function store(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function pref(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function ui(on){
    b.setAttribute('aria-pressed',on?'true':'false');
    var t=on?'Tắt nhạc nền':'Bật nhạc nền';
    b.setAttribute('aria-label',t);b.title=t;
    ic.textContent=on?'❚❚':'♪';
  }
  function play(){
    var p;
    try{p=a.play()}catch(e){ui(false);return}
    if(p&&typeof p.then==='function'){p.then(function(){ui(true)},function(){ui(false)})}else{ui(!a.paused)}
  }
  b.addEventListener('click',function(e){
    e.stopPropagation();disarm();
    if(a.paused){store('on');ui(true);play()}else{a.pause();store('off');ui(false)}
  });
  a.addEventListener('pause',function(){ui(false)});
  a.addEventListener('playing',function(){ui(true)});
  a.addEventListener('error',function(){ui(false)});
  var evs=['pointerdown','keydown','touchstart'];
  function resume(e){
    if(e&&e.target&&b.contains(e.target))return;
    disarm();if(a.paused){ui(true);play()}
  }
  function disarm(){evs.forEach(function(t){document.removeEventListener(t,resume,true)})}
  ui(false);
  if(pref()==='on'){evs.forEach(function(t){document.addEventListener(t,resume,{capture:true,passive:true})})}
})();
</script>

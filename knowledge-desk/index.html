<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge Desk – Thư viện kiến thức ngân hàng</title>
<meta name="description" content="Knowledge Desk: tra cứu, thẻ ghi nhớ, quiz, công thức và trợ lý Pip cho nghiệp vụ ngân hàng.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13294B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Knowledge Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f3f5f7; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
  #wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #13294B; gap: 14px; }
  #wait img { width: 72px; height: 72px; border-radius: 16px; }
  #wait.hide { display: none; }
</style>
</head>
<body>
<div id="wait"><img src="apple-touch-icon.png" alt=""><div>Đang mở Knowledge Desk…</div></div>
<iframe id="app" title="Knowledge Desk"
  src="https://script.google.com/macros/s/AKfycby3uRjriU6rp5NvruYQ7Dug3p6um_3UXVqx9Sqa8m-Xlg8GZgwm3MTSzU6DWiQ4yu7Syw/exec"
  allow="clipboard-write; fullscreen" allowfullscreen></iframe>
<script>
  document.getElementById('app').addEventListener('load', function () {
    document.getElementById('wait').classList.add('hide');
  });
</script>
</body>
</html>
